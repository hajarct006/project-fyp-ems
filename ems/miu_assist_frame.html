<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miu Assist</title>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff9fb;
    font-family:'Poppins',sans-serif;
}

#webchat-container{
    position:relative;
    width:100%;
    height:100%;
}

/* Hide the floating launcher bubble - this iframe is already the
   chat window itself, opened by the parent page's own button. */
.bpFab{
    display:none !important;
}

/* Make the chat window fill this entire iframe/container. */
.bpWebchat{
    position:absolute !important;
    top:0 !important;
    left:0 !important;
    right:0 !important;
    bottom:0 !important;
    width:100% !important;
    height:100% !important;
    max-height:100% !important;
}

</style>

</head>

<body>

<div id="webchat-container"></div>

<script src="https://cdn.botpress.cloud/webchat/v3.7/inject.js"></script>
<script src="https://files.bpcontent.cloud/2026/08/11/08/20260811085246-IBL6AL3O.js" defer></script>
    

<script>
window.addEventListener("load", function () {

    function applyBotIdentity() {
        if (!window.botpress) {
            setTimeout(applyBotIdentity, 500);
            return;
        }

        window.botpress.on("webchat:initialized", function () {

            window.botpress.config({
                configuration: {
                    botName: "MiuAssist",
                    botDescription: "JPP EMS Helper"
                }
            });

            window.botpress.open();
        });
    }

    applyBotIdentity();

});
</script>

</body>

</html>
